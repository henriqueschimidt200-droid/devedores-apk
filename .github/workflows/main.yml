name: Devedores - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Gerar APK Android
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager não encontrado."
            exit 1
          fi

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$(dirname "$(dirname "$(dirname "$SDKMANAGER")")")}}"

          echo "SDK: $SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Conferir estrutura do projeto
        shell: bash
        run: |
          set -e
          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -d app
          test -f app/build.gradle || test -f app/build.gradle.kts
          echo "Projeto Android encontrado."

      - name: Gerar APK Debug
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon --console=plain

      - name: Conferir APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          echo "APK gerado com sucesso:"
          ls -lh "$APK"

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Devedores-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
