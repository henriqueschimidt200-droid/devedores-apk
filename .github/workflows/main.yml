name: Devedores - Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Localizar Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME="$HOME/android-sdk"
            export ANDROID_SDK_ROOT="$HOME/android-sdk"
          fi

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Instalar componentes Android
        shell: bash
        run: |
          SDK="${ANDROID_HOME}"

          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$SDK" -type f -name sdkmanager 2>/dev/null | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado."
            exit 1
          fi

          "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verificar projeto
        shell: bash
        run: |
          echo "=== RAIZ DO PROJETO ==="
          ls -la

          echo "=== PASTA APP ==="
          if [ ! -d "app" ]; then
            echo "ERRO: a pasta app não existe."
            exit 1
          fi

          ls -la app

          echo "=== ARQUIVOS GRADLE ==="

          if [ -f "settings.gradle" ]; then
            echo "settings.gradle encontrado"
          fi

          if [ -f "settings.gradle.kts" ]; then
            echo "settings.gradle.kts encontrado"
          fi

          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "ERRO: settings.gradle ou settings.gradle.kts não encontrado."
            exit 1
          fi

      - name: Compilar APK Debug
        shell: bash
        run: |
          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Procurar APK
        shell: bash
        run: |
          echo "=== APKs GERADOS ==="
          find . -type f -name "*.apk" -print

      - name: Verificar APK final
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "APK encontrado:"
          ls -lh "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Devedores-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
